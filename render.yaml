# Render Blueprint for the Lago MCP server.
# Render builds mcp/Dockerfile, which runs the Streamable HTTP server bound to 0.0.0.0:$PORT.
# Stateless / header-passthrough: NO Lago key is set here — each request carries its own
# X-LAGO-API-KEY + X-LAGO-API-URL headers.
services:
  - type: web
    name: lago-mcp
    runtime: docker
    branch: deploy/render
    rootDir: mcp
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RUST_LOG
        value: info
      # Allow per-request X-LAGO-API-URL to point at self-hosted / ngrok Lago instances
      # (not just api.getlago.com / api.eu.getlago.com). Trade-off: this lifts the SSRF host
      # allowlist, so the server will call whatever URL a request supplies — acceptable here
      # because each caller also supplies its own X-LAGO-API-KEY (its own Lago).
      - key: LAGO_ALLOW_ANY_API_URL
        value: "true"
