name: MCP Docker Build
on:
  push:
    tags:
      - "*"
    branches:
      - main
    paths:
      - mcp/**
      - .github/workflows/mcp-docker-build.yml
  workflow_dispatch:
jobs:
  build-mcp-image:
    name: Build MCP Image
    uses: getlago/lago/.github/workflows/docker-build-multi-arch.yaml@main
    with:
      image-name: ghcr.io/getlago/mcp-server
      registry: ghcr
      context: mcp
      dockerfile: mcp/Dockerfile
      # Without this, `latest` only moves on a semver tag push (metadata-action's
      # latest=auto flavor), so it has pointed at 0.1.0 since Nov 2025 while every
      # merge here only updated `main` and `sha-<commit>`.
      tags: |
        type=raw,value=latest,enable={{is_default_branch}}
